<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나이트 베이스볼 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 3D 화면 -->
<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="replay-tag"></div>

<!-- 왼쪽 위 점수판: 점수·이닝, 주자, 볼·스트라이크·아웃 -->
<div id="hud">
  <div>
    <div id="sc">0점</div>
    <div id="inn"></div>
  </div>
  <div id="dia"><b id="bs2" style="left:2px;top:14px"></b><b id="bs1" style="left:20px;top:2px"></b><b id="bs0" style="left:38px;top:14px"></b></div>
  <div id="cnt"><span>B</span><span id="bd"></span><span>S</span><span id="sd"></span><span>O</span><span id="od"></span></div>
</div>

<!-- 경기 중 표시: 투수 교체 버튼, 타자 카드, 정보 띠, 안내 글, 배너, 상황별 버튼 -->
<button id="sw"></button>
<!-- 오른쪽 위 타자 카드: 이름·타순·오늘 기록 + 작은 9칸 핫존(공이 지나간 자리) -->
<div id="card"><div id="cardText"></div><canvas id="zone" width="84" height="110"></canvas></div>
<div id="info"></div>
<div id="hint"></div>
<div id="banner"></div>
<div id="ctl"></div>

<!-- 타이밍 미터: 스윙할 때마다 잠깐(가운데 = 완벽, 왼쪽 = 빠름, 오른쪽 = 늦음) -->
<div id="meter"><div class="track"><i class="perfect"></i><i class="mid"></i><b id="meterDot"></b></div><span id="meterText"></span></div>

<!-- 투수 시점: 체력 막대와 투구 세기 막대 -->
<div id="pg">
  <div id="pgl"></div>
  <div class="bar" id="stb"><i id="stf"></i></div>
  <div class="bar" id="pwb"><i id="pwf"></i></div>
</div>


<!-- 타이틀 화면 -->
<div class="ov" id="title">
  <div class="big">⚾</div>
  <h1>나이트 베이스볼 3D</h1>
  <p>투수가 던진 공이 홈플레이트에 닿는 순간<br>화면을 탭해서 스윙!</p>
  <p style="color:#9fb0e8;font-size:16px"><span id="modeText">9회 정식 경기</span> · 초엔 타자, 말엔 투수 시점으로 번갈아 뛰어요</p>
  <p style="color:#9fb0e8;font-size:15px">타자: 도루 버튼 · 안타 후 탭하면 한 베이스 더<br>투수: 구종 선택 → 화면을 드래그로 조준 → 손 떼면 투구 · 견제/고의사구 버튼</p>
  <!-- 경기 설정(고른 값은 기기에 기억한다) -->
  <div id="settings">
    <div class="set-row">
      <span class="set-label">난이도</span>
      <div class="seg" data-key="level"><button data-v="rookie">루키</button><button data-v="pro">프로</button></div>
      <span class="set-label">이닝</span>
      <div class="seg" data-key="innings"><button data-v="3">3회</button><button data-v="6">6회</button><button data-v="9">9회</button></div>
      <span class="set-label">존 위 핫존</span>
      <div class="seg" data-key="hotZone"><button data-v="off">끄기</button><button data-v="on">켜기</button></div>
      <span class="set-label">정밀 타격</span>
      <div class="seg" data-key="precision"><button data-v="off">끄기</button><button data-v="on">켜기</button></div>
    </div>
    <div class="set-row">
      <span class="set-label">시간</span>
      <div class="seg" data-key="tod"><button data-v="auto">자동</button><button data-v="day">낮</button><button data-v="evening">저녁</button><button data-v="night">밤</button></div>
      <span class="set-label">소리</span>
      <div class="seg" data-key="sound"><button data-v="on">켜기</button><button data-v="off">끄기</button></div>
      <span class="set-label">음량</span>
      <div id="volBar" aria-label="음량"><i id="volFill"></i></div>
    </div>
  </div>
  <div id="pc"></div>
  <button id="btn-ex">🏆 시즌 페넌트레이스 (9경기)</button>
  <button id="ho">내 타석: 선수별</button>
  <div class="cta" id="mS">탭해서 경기 시작</div>
</div>

<!-- 경기 종료 화면 -->
<div class="ov" id="end">
  <h1>경기 종료</h1>
  <div class="big" id="fs"></div>
  <p id="fd"></p>
  <p id="fb"></p>
  <div class="cta">탭해서 다시 하기</div>
</div>

<!-- 시즌: 경기 사이 페넌트레이스 창 -->
<div id="season-modal">
  <h2>🏆 페넌트레이스</h2>
  <div class="box" id="season-info"></div>
  <div class="cta" id="season-next">경기 시작</div>
</div>

<!-- 다이빙 캐치 버튼(수비 중 아슬아슬한 타구) -->
<button id="dv">🤿 다이빙 캐치!<small>또는 화면 스와이프</small></button>

<!-- 시즌 종료 기록실·명예의 전당 -->
<div id="hof">
  <div id="hof-roll"><div class="in" id="hof-in"></div></div>
  <div class="cta" id="hof-next">기록실 닫기</div>
</div>

<!-- 일시정지 버튼(오른쪽 위)과 일시정지 창 -->
<button id="pauseBtn" aria-label="일시정지">❚❚</button>
<div class="ov" id="pause">
  <h1>일시정지</h1>
  <button class="menu-btn" id="resumeBtn">▶ 이어하기</button>
  <button class="menu-btn" id="toTitleBtn">처음으로</button>
</div>

<!-- 초당 프레임 수(PERF.showFps 또는 주소 끝 ?fps 일 때만) -->
<div id="fps"></div>

<!-- 3D 라이브러리(three.js r128) → 게임 코드. 순서가 중요하다(README 참고) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/scene.js"></script>
<script src="js/stadium.js"></script>
<script src="js/players.js"></script>
<script src="js/audio.js"></script>
<script src="js/teams.js"></script>
<script src="js/pitching.js"></script>
<script src="js/batting.js"></script>
<script src="js/fielding.js"></script>
<script src="js/running.js"></script>
<script src="js/game.js"></script>
<script src="js/season.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
