<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>풀카운트 v0.1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 레이아웃: 화면 전체가 3D 구장, 위에는 전광판 한 줄, 아래에는 조작 버튼 */
:root {
  --board: #14301f;      /* 전광판 바탕(구장 짙은 녹색) */
  --board-edge: #2c5a3c;
  --chalk: #f3f1e6;      /* 분필색 글자 */
  --bulb: #ffc23d;       /* 전광판 전구(볼) */
  --bulb-red: #ff5a4a;   /* 스트라이크·아웃 */
  --bulb-off: #2a4434;
  --ink: #0d1b12;
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink); color: var(--chalk); font-family: var(--font-body);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; }
#game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

/* 전광판 */
.board {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  pointer-events: none;
}
.board > * { pointer-events: auto; }
.count {
  display: flex; gap: 14px; align-items: center; padding: 8px 14px;
  background: var(--board); border: 2px solid var(--board-edge); border-radius: 10px;
  font-family: var(--font-display); font-size: 20px; letter-spacing: .04em;
}
.count .row { display: flex; gap: 6px; align-items: center; }
.bulb { width: 14px; height: 14px; border-radius: 50%; background: var(--bulb-off); }
.b .on { background: var(--bulb); box-shadow: 0 0 8px var(--bulb); }
.s .on, .o .on { background: var(--bulb-red); box-shadow: 0 0 8px var(--bulb-red); }
.stats { font-family: var(--font-display); font-size: 17px; color: var(--chalk); opacity: .9; font-variant-numeric: tabular-nums; }
.modes { display: flex; gap: 6px; padding: 4px; background: var(--board); border: 2px solid var(--board-edge); border-radius: 10px; }
.modes button, .chip {
  font-family: var(--font-display); font-size: 18px; color: var(--chalk);
  background: transparent; border: 0; border-radius: 7px; padding: 8px 14px; min-height: 44px; cursor: pointer;
}
.modes button[aria-pressed="true"] { background: var(--chalk); color: var(--board); }
button:focus-visible { outline: 3px solid var(--bulb); outline-offset: 2px; }

/* 하단 조작 */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: flex-end;
  pointer-events: none;
}
.dock > * { pointer-events: auto; }
.card {
  width: 92px; min-height: 64px; padding: 8px 6px; border-radius: 10px; cursor: pointer;
  background: var(--board); color: var(--chalk); border: 2px solid var(--board-edge);
  font-family: var(--font-display); font-size: 19px; display: grid; gap: 2px; justify-items: center;
}
.card small { font-family: var(--font-body); font-size: 11px; opacity: .75; }
.card[aria-pressed="true"] { border-color: var(--bulb); box-shadow: 0 0 0 2px var(--bulb) inset; }
.chip { background: var(--board); border: 2px solid var(--board-edge); }
.chip[aria-pressed="true"] { border-color: var(--bulb-red); color: var(--bulb-red); }

/* 안내·결과 */
.hint {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 4;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  max-width: min(560px, calc(100% - 32px)); text-align: center;
  font-size: 15px; line-height: 1.5; padding: 6px 12px; border-radius: 8px;
  background: rgba(13, 27, 18, .72); pointer-events: none;
}
.banner {
  position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.9); z-index: 6;
  font-family: var(--font-display); font-size: clamp(44px, 9vw, 96px); color: var(--chalk);
  text-shadow: 0 4px 0 var(--ink), 0 0 24px rgba(0,0,0,.5); letter-spacing: .02em;
  opacity: 0; transition: opacity .15s, transform .25s; pointer-events: none; white-space: nowrap;
}
.banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.banner .sub { display: block; text-align: center; font-size: .32em; margin-top: 4px; opacity: .9; }
.next {
  position: fixed; left: 50%; top: 58%; transform: translateX(-50%); z-index: 6;
  font-family: var(--font-display); font-size: 22px; padding: 12px 26px; min-height: 52px; border-radius: 12px; cursor: pointer;
  background: var(--bulb); color: var(--ink); border: 0;
}
/* 투구 링(손가락 위치) */
.ring { position: fixed; z-index: 4; pointer-events: none; border-radius: 50%; transform: translate(-50%, -50%); }
#aimTarget { width: 56px; height: 56px; border: 3px solid var(--chalk); opacity: .9; }
#aimShrink { width: 56px; height: 56px; border: 3px solid var(--bulb); }
#tapMark { width: 40px; height: 40px; border: 3px solid var(--bulb); opacity: 0; transition: opacity .3s; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 28px; z-index: 9; background: var(--ink); }
@media (max-width: 560px) {
  .card { width: 72px; font-size: 16px; }
  .count { font-size: 16px; gap: 10px; padding: 6px 10px; }
  .modes button { font-size: 16px; padding: 6px 10px; }
  .stats { display: none; }
}
@media (prefers-reduced-motion: reduce) { .banner { transition: none; } }
</style>
</head>
<body>

<div id="stage"><canvas id="game" aria-label="야구장"></canvas></div>

<div class="board">
  <div class="count" aria-live="polite">
    <div class="row b" aria-label="볼">B <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span></div>
    <div class="row s" aria-label="스트라이크">S <span class="bulb"></span><span class="bulb"></span></div>
    <div class="row o" aria-label="아웃">O <span class="bulb"></span><span class="bulb"></span></div>
  </div>
  <div class="stats" id="stats">타석 0 · 안타 0 · 홈런 0 · 삼진 0</div>
  <div class="modes" role="group" aria-label="모드">
    <button id="modeBat" aria-pressed="true">타격</button>
    <button id="modePitch" aria-pressed="false">투구</button>
  </div>
</div>

<div class="dock" id="batDock">
  <button class="chip" id="powerBtn" aria-pressed="false">파워 스윙</button>
  <button class="chip" id="slowBtn" aria-pressed="true">루키(느리게)</button>
</div>
<div class="dock" id="pitchDock" hidden>
  <button class="card" data-pitch="fast" aria-pressed="true">직구<small>빠르고 곧게</small></button>
  <button class="card" data-pitch="slider" aria-pressed="false">슬라이더<small>옆으로 휨</small></button>
  <button class="card" data-pitch="curve" aria-pressed="false">커브<small>크게 떨어짐</small></button>
  <button class="card" data-pitch="change" aria-pressed="false">체인지업<small>느리게 떨어짐</small></button>
</div>

<div class="hint" id="hint">공이 홈플레이트에 들어오는 순간, 공이 있는 곳을 탭하세요.</div>
<div class="banner" id="banner"></div>
<button class="next" id="nextBtn" hidden>다음 타석</button>
<div class="ring" id="aimTarget" hidden></div>
<div class="ring" id="aimShrink" hidden></div>
<div class="ring" id="tapMark"></div>
<div class="loading" id="loading">구장 준비 중…</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.20.0/babylon.js"></script>
<script>
(() => {
  // ---------- 상수 ----------
  const MOUND_Z = 18.44;            // 투수판~홈플레이트 거리(m)
  const ZONE = { x: 0.22, yLo: 0.50, yHi: 1.10 };  // 스트라이크존(m)
  const PITCHES = {
    fast:   { name: '직구',     kmh: 145, brk: [0.02, 0.10] },
    slider: { name: '슬라이더', kmh: 132, brk: [0.38, -0.10] },
    curve:  { name: '커브',     kmh: 118, brk: [0.15, -0.55] },
    change: { name: '체인지업', kmh: 125, brk: [-0.12, -0.30] },
  };

  // ---------- 상태 ----------
  const S = {
    mode: 'bat', balls: 0, strikes: 0, outs: 0,
    stats: { pa: 0, hit: 0, hr: 0, k: 0 },
    phase: 'idle',      // idle | windup | pitch | flight | result
    pitch: null, swing: null, power: false, rookie: true,
    selPitch: 'fast',
  };

  const $ = id => document.getElementById(id);
  const canvas = $('game');
  if (!window.BABYLON) { $('loading').textContent = '3D 엔진을 불러오지 못했어요. 새로고침해 주세요.'; return; }

  // ---------- 장면 ----------
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: false, stencil: false, adaptToDeviceRatio: true });
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = BABYLON.Color4.FromHexString('#8fd0f2ff');
  scene.ambientColor = new BABYLON.Color3(0.4, 0.4, 0.4);

  const cam = new BABYLON.UniversalCamera('cam', new BABYLON.Vector3(0, 1.35, -4.6), scene);
  cam.setTarget(new BABYLON.Vector3(0, 0.5, MOUND_Z));
  cam.fov = 0.55; cam.minZ = 0.05; cam.inputs.clear();

  const hemi = new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0.2, 1, -0.3), scene);
  hemi.intensity = 0.85; hemi.groundColor = new BABYLON.Color3(0.35, 0.45, 0.35);
  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.4, -1, 0.6), scene);
  sun.intensity = 0.7;

  const mat = (hex, opts = {}) => {
    const m = new BABYLON.StandardMaterial('m' + hex + Math.random(), scene);
    m.diffuseColor = BABYLON.Color3.FromHexString(hex);
    m.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);
    if (opts.emissive) m.emissiveColor = BABYLON.Color3.FromHexString(opts.emissive);
    if (opts.alpha != null) m.alpha = opts.alpha;
    return m;
  };

  // 잔디, 내야 흙, 마운드, 홈플레이트
  const grass = BABYLON.MeshBuilder.CreateGround('grass', { width: 260, height: 260 }, scene);
  grass.position.z = 100; grass.material = mat('#3f9b4a');
  const stripes = mat('#47a853');
  for (let i = 0; i < 9; i++) {
    const st = BABYLON.MeshBuilder.CreateGround('st' + i, { width: 260, height: 9 }, scene);
    st.position.set(0, 0.005, 25 + i * 18); st.material = stripes;
  }
  const dirt = mat('#c58b55');
  const infield = BABYLON.MeshBuilder.CreateGround('inf', { width: 27.4, height: 27.4 }, scene);
  infield.rotation.y = Math.PI / 4; infield.position.set(0, 0.01, 27.43 / Math.SQRT2);
  infield.material = dirt;
  const grassIn = BABYLON.MeshBuilder.CreateGround('gin', { width: 21, height: 21 }, scene);
  grassIn.rotation.y = Math.PI / 4; grassIn.position.set(0, 0.015, 27.43 / Math.SQRT2 + 0.6); grassIn.material = mat('#43a24e');
  const mound = BABYLON.MeshBuilder.CreateCylinder('mound', { diameterTop: 2.2, diameterBottom: 5.5, height: 0.25, tessellation: 32 }, scene);
  mound.position.set(0, 0.12, MOUND_Z); mound.material = dirt;
  const homeDirt = BABYLON.MeshBuilder.CreateDisc('hd', { radius: 4, tessellation: 40 }, scene);
  homeDirt.rotation.x = Math.PI / 2; homeDirt.position.set(0, 0.02, 0); homeDirt.material = dirt;
  const plate = BABYLON.MeshBuilder.CreateBox('plate', { width: 0.43, height: 0.02, depth: 0.43 }, scene);
  plate.position.set(0, 0.03, 0.1); plate.material = mat('#ffffff');
  // 베이스
  [[19.4, 19.4], [0, 38.8], [-19.4, 19.4]].forEach(([x, z], i) => {
    const b = BABYLON.MeshBuilder.CreateBox('base' + i, { width: 0.38, height: 0.06, depth: 0.38 }, scene);
    b.position.set(x, 0.04, z); b.material = mat('#ffffff');
  });
  // 파울라인
  const lineMat = mat('#ffffff', { emissive: '#666666' });
  [-1, 1].forEach(s => {
    const l = BABYLON.MeshBuilder.CreateGround('fl' + s, { width: 0.1, height: 140 }, scene);
    l.rotation.y = s * Math.PI / 4; l.position.set(s * 70 / Math.SQRT2, 0.03, 70 / Math.SQRT2); l.material = lineMat;
  });
  // 외야 펜스(반지름 105m 호)
  const fenceMat = mat('#1f5a36');
  for (let a = -45; a <= 45; a += 3) {
    const r = a * Math.PI / 180, R = 105;
    const f = BABYLON.MeshBuilder.CreateBox('f' + a, { width: 5.6, height: 3, depth: 0.4 }, scene);
    f.position.set(Math.sin(r) * R, 1.5, Math.cos(r) * R); f.rotation.y = r; f.material = fenceMat;
  }
  // 관중석 띠
  const standMat = mat('#2b3c55');
  for (let a = -60; a <= 60; a += 6) {
    const r = a * Math.PI / 180, R = 118;
    const st = BABYLON.MeshBuilder.CreateBox('s' + a, { width: 13, height: 16, depth: 8 }, scene);
    st.position.set(Math.sin(r) * R, 8, Math.cos(r) * R); st.rotation.y = r; st.rotation.x = -0.35; st.material = standMat;
  }

  // 카툰 선수: 몸통 캡슐 + 머리 + 모자
  const makePlayer = (shirt, cap) => {
    const root = new BABYLON.TransformNode('p', scene);
    const body = BABYLON.MeshBuilder.CreateCapsule('b', { radius: 0.32, height: 1.25 }, scene);
    body.position.y = 0.75; body.material = mat(shirt); body.parent = root;
    const head = BABYLON.MeshBuilder.CreateSphere('h', { diameter: 0.5, segments: 16 }, scene);
    head.position.y = 1.62; head.material = mat('#f2c9a0'); head.parent = root;
    const capM = BABYLON.MeshBuilder.CreateSphere('c', { diameter: 0.52, segments: 16, slice: 0.5 }, scene);
    capM.position.y = 1.68; capM.material = mat(cap); capM.parent = root;
    const brim = BABYLON.MeshBuilder.CreateCylinder('br', { diameter: 0.34, height: 0.03 }, scene);
    brim.position.set(0, 1.69, 0.22); brim.material = capM.material; brim.parent = root;
    return root;
  };
  const pitcher = makePlayer('#e9eef2', '#1d3f8f');
  pitcher.position.set(0, 0.24, MOUND_Z); pitcher.rotation.y = Math.PI;
  const pitchArm = BABYLON.MeshBuilder.CreateCapsule('arm', { radius: 0.08, height: 0.7 }, scene);
  pitchArm.material = mat('#e9eef2'); pitchArm.parent = pitcher;
  pitchArm.setPivotPoint(new BABYLON.Vector3(0, 0.3, 0));
  pitchArm.position.set(-0.38, 1.05, 0);

  const batter = makePlayer('#b8222c', '#b8222c');
  batter.position.set(-0.95, 0, 0.1); batter.rotation.y = Math.PI / 2;
  batter.getChildMeshes().forEach(m => { m.material = m.material.clone('bm'); m.material.alpha = 0.55; });
  const batPivot = new BABYLON.TransformNode('bp', scene);
  batPivot.position.set(-0.62, 1.1, 0.1);
  const bat = BABYLON.MeshBuilder.CreateCylinder('bat', { diameterTop: 0.07, diameterBottom: 0.035, height: 0.86 }, scene);
  bat.material = mat('#d9a066'); bat.parent = batPivot; bat.position.set(0, 0.43, 0);
  const BAT_REST = new BABYLON.Vector3(0.0, 0, -0.6);
  batPivot.rotation.copyFrom(BAT_REST);

  // 스트라이크존 테두리(조준용)
  const zoneLines = BABYLON.MeshBuilder.CreateLines('zone', { points: [
    new BABYLON.Vector3(-ZONE.x, ZONE.yLo, 0), new BABYLON.Vector3(ZONE.x, ZONE.yLo, 0),
    new BABYLON.Vector3(ZONE.x, ZONE.yHi, 0), new BABYLON.Vector3(-ZONE.x, ZONE.yHi, 0),
    new BABYLON.Vector3(-ZONE.x, ZONE.yLo, 0)] }, scene);
  zoneLines.color = new BABYLON.Color3(1, 1, 1); zoneLines.alpha = 0.55;
  // 탭 판정용 보이지 않는 판(홈플레이트 위 세로면)
  const hitPlane = BABYLON.MeshBuilder.CreatePlane('hp', { width: 6, height: 4 }, scene);
  hitPlane.position.set(0, 1, 0); hitPlane.rotation.y = Math.PI; hitPlane.visibility = 0; hitPlane.isPickable = true;

  const ball = BABYLON.MeshBuilder.CreateSphere('ball', { diameter: 0.09, segments: 12 }, scene);
  ball.material = mat('#ffffff', { emissive: '#bbbbbb' }); ball.isVisible = false;
  const shadow = BABYLON.MeshBuilder.CreateDisc('sh', { radius: 0.07, tessellation: 16 }, scene);
  shadow.rotation.x = Math.PI / 2; shadow.material = mat('#000000', { alpha: 0.35 }); shadow.isVisible = false;
  const landMark = BABYLON.MeshBuilder.CreateDisc('lm', { radius: 0.12, tessellation: 20 }, scene);
  landMark.rotation.x = Math.PI / 2; landMark.material = mat('#ffc23d', { emissive: '#ffc23d' }); landMark.isVisible = false;

  // ---------- 유틸 ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const inZone = p => Math.abs(p.x) <= ZONE.x + 0.037 && p.y >= ZONE.yLo - 0.037 && p.y <= ZONE.yHi + 0.037;
  const now = () => performance.now();
  const toScreen = v => {
    const p = BABYLON.Vector3.Project(v, BABYLON.Matrix.Identity(), scene.getTransformMatrix(),
      cam.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));
    const k = canvas.clientWidth / engine.getRenderWidth();
    const r = canvas.getBoundingClientRect();
    return { x: r.left + p.x * k, y: r.top + p.y * k };
  };
  const pickPlate = (cx, cy) => {
    const r = canvas.getBoundingClientRect();
    const k = engine.getRenderWidth() / canvas.clientWidth;
    const pk = scene.pick((cx - r.left) * k, (cy - r.top) * k, m => m === hitPlane);
    return pk && pk.hit ? pk.pickedPoint : null;
  };

  // ---------- 전광판 ----------
  const renderBoard = () => {
    const set = (cls, n) => document.querySelectorAll('.' + cls + ' .bulb').forEach((b, i) => b.classList.toggle('on', i < n));
    set('b', S.balls); set('s', S.strikes); set('o', S.outs);
    const st = S.stats;
    $('stats').textContent = S.mode === 'bat'
      ? `타석 ${st.pa} · 안타 ${st.hit} · 홈런 ${st.hr} · 삼진 ${st.k}`
      : `상대 타자 ${st.pa} · 피안타 ${st.hit} · 피홈런 ${st.hr} · 탈삼진 ${st.k}`;
  };
  let bannerTimer = 0;
  const banner = (text, sub = '', ms = 1300) => {
    const b = $('banner');
    b.innerHTML = text + (sub ? `<span class="sub">${sub}</span>` : '');
    b.classList.add('show');
    clearTimeout(bannerTimer);
    if (ms) bannerTimer = setTimeout(() => b.classList.remove('show'), ms);
  };
  const hint = t => { $('hint').textContent = t; };

  // ---------- 투구 생성 ----------
  // 투구 궤적: 직선 경로 + 늦게 꺾이는 변화. 끝점은 항상 target.
  const makePitch = (type, target, quality = 1) => {
    const P = PITCHES[type];
    const speedFactor = (S.mode === 'bat' && S.rookie) ? 0.72 : 1;
    const kmh = P.kmh * (0.9 + 0.1 * quality);
    const mps = kmh / 3.6 * speedFactor;
    const start = new BABYLON.Vector3(-0.45, 1.85, MOUND_Z - 1.2);
    const brk = new BABYLON.Vector3(P.brk[0], P.brk[1], 0);
    const dur = (start.z - target.z) / mps;
    return { type, name: P.name, kmh: Math.round(kmh), start, target: target.clone(), brk, dur, t0: 0 };
  };
  const pitchPos = (pc, s) => {
    const aim = pc.target.subtract(pc.brk);
    const p = BABYLON.Vector3.Lerp(pc.start, aim, s);
    return p.add(pc.brk.scale(s * s * s));
  };

  // ---------- 타구 결과 ----------
  // ev: 타구 속도(km/h), la: 발사각(도), dir: 좌우 각도(도, 음수=3루 쪽)
  const simFlight = (ev, la, dir) => {
    const v = ev / 3.6, th = la * Math.PI / 180, ph = dir * Math.PI / 180;
    let p = new BABYLON.Vector3(0, 1.0, 0.3);
    let vel = new BABYLON.Vector3(Math.sin(ph) * Math.cos(th) * v, Math.sin(th) * v, Math.cos(ph) * Math.cos(th) * v);
    const pts = [p.clone()]; const dt = 1 / 60; let t = 0;
    while (p.y > 0 && t < 8) {
      const sp = vel.length(); const drag = 0.0045 * sp;
      vel = vel.add(new BABYLON.Vector3(-vel.x * drag * dt, -9.8 * dt - vel.y * drag * dt, -vel.z * drag * dt));
      p = p.add(vel.scale(dt)); pts.push(p.clone()); t += dt;
    }
    const land = pts[pts.length - 1];
    const dist = Math.hypot(land.x, land.z);
    return { pts, dist, hang: t, land };
  };
  const judgeBatted = (ev, la, dir) => {
    const fl = simFlight(ev, la, dir);
    if (Math.abs(dir) > 45) return { kind: 'foul', fl };
    // 펜스를 넘을 때의 높이로 홈런 판정
    const atWall = fl.pts.find(q => Math.hypot(q.x, q.z) >= 105);
    if (atWall && atWall.y > 3) return { kind: 'hr', fl };
    if (la > 50) return { kind: 'out', label: '내야 뜬공', fl };
    if (la < 8) {
      const p = ev > 150 ? 0.45 : ev > 125 ? 0.25 : 0.1;
      return Math.random() < p ? { kind: 'hit', label: '땅볼 안타', bases: 1, fl } : { kind: 'out', label: '땅볼 아웃', fl };
    }
    if (la < 25) {
      const p = ev > 140 ? 0.75 : ev > 115 ? 0.55 : 0.3;
      if (Math.random() < p) return { kind: 'hit', label: fl.dist > 70 ? '2루타' : '안타', bases: fl.dist > 70 ? 2 : 1, fl };
      return { kind: 'out', label: '라인드라이브 아웃', fl };
    }
    if (fl.dist > 95 && Math.random() < 0.5) return { kind: 'hit', label: '펜스 직격 2루타', bases: 2, fl };
    if (fl.dist > 60 && fl.dist < 80 && Math.random() < 0.25) return { kind: 'hit', label: '텍사스 안타', bases: 1, fl };
    return { kind: 'out', label: '뜬공 아웃', fl };
  };

  // ---------- 진행 ----------
  let flight = null;
  const resetCount = () => { S.balls = 0; S.strikes = 0; };
  const endPA = (kind, text, sub) => {
    S.stats.pa++;
    if (kind === 'hit' || kind === 'hr') S.stats.hit++;
    if (kind === 'hr') S.stats.hr++;
    if (kind === 'k') S.stats.k++;
    if (kind === 'k' || kind === 'out') S.outs++;
    renderBoard();
    banner(text, sub, 0);
    S.phase = 'result';
    setTimeout(() => {
      $('nextBtn').textContent = S.outs >= 3 ? '공수 끝 · 다시 시작' : '다음 타석';
      $('nextBtn').hidden = false; $('nextBtn').focus({ preventScroll: true });
    }, 600);
  };
  const nextPA = () => {
    $('nextBtn').hidden = true; $('banner').classList.remove('show');
    if (S.outs >= 3) S.outs = 0;
    resetCount(); renderBoard(); landMark.isVisible = false; ball.isVisible = false; shadow.isVisible = false;
    S.phase = 'idle';
    if (S.mode === 'bat') setTimeout(startAIPitch, 700); else readyPitch();
  };
  const callPitch = (res, sub) => {
    // res: 'ball' | 'strike' | 'foul'
    if (res === 'ball') {
      S.balls++;
      if (S.balls >= 4) return endPA('bb', '볼넷', sub);
      banner('볼', sub, 900);
    } else if (res === 'strike') {
      S.strikes++;
      if (S.strikes >= 3) return endPA('k', '삼진', sub);
      banner('스트라이크', sub, 900);
    } else if (res === 'foul') {
      if (S.strikes < 2) S.strikes++;
      banner('파울', sub, 900);
    }
    renderBoard();
    S.phase = 'idle';
    setTimeout(() => { if (S.mode === 'bat') startAIPitch(); else readyPitch(); }, 1300);
  };

  // ---------- 타격 모드: AI가 던지고 내가 친다 ----------
  const startAIPitch = () => {
    if (S.mode !== 'bat' || S.phase !== 'idle') return;
    const types = Object.keys(PITCHES);
    const type = types[Math.floor(Math.random() * types.length)];
    const wantStrike = S.balls >= 3 ? 0.85 : S.strikes >= 2 ? 0.45 : 0.62;
    const tgt = Math.random() < wantStrike
      ? new BABYLON.Vector3(rand(-ZONE.x, ZONE.x), rand(ZONE.yLo + 0.03, ZONE.yHi - 0.03), 0)
      : new BABYLON.Vector3(rand(-0.42, 0.42), rand(0.3, 1.35), 0);
    S.pitch = makePitch(type, tgt, rand(0.85, 1));
    S.swing = null;
    windup(() => { S.pitch.t0 = now(); S.phase = 'pitch'; ball.isVisible = true; shadow.isVisible = true; });
    hint('공이 홈플레이트에 들어오는 순간, 공이 있는 곳을 탭하세요.');
  };
  let windT = 0, windCb = null;
  const windup = cb => { S.phase = 'windup'; windT = now(); windCb = cb; };

  const doSwing = (cx, cy) => {
    if (S.mode !== 'bat' || S.phase !== 'pitch' || S.swing) return;
    const pt = pickPlate(cx, cy);
    const t = now();
    S.swing = { t, pt };
    swingAnim = now();
    const m = $('tapMark'); m.style.left = cx + 'px'; m.style.top = cy + 'px'; m.style.opacity = 1;
    setTimeout(() => { m.style.opacity = 0; }, 350);
  };
  const resolveSwing = () => {
    const pc = S.pitch, sw = S.swing;
    const arrive = pc.t0 + pc.dur * 1000;
    const dt = sw.t - arrive;                 // + 늦음, - 빠름
    const win = (S.rookie ? 170 : 120) * (S.power ? 0.7 : 1);
    const posWin = (S.rookie ? 0.2 : 0.15) * (S.power ? 0.75 : 1);
    const actual = pc.target;
    const sub = `${pc.name} ${pc.kmh}km/h`;
    if (!sw.pt || Math.abs(dt) > win) return callPitch('strike', sub + (dt < 0 ? ' · 너무 빨랐어요' : ' · 너무 늦었어요'));
    const dx = sw.pt.x - actual.x, dy = sw.pt.y - actual.y;
    const off = Math.hypot(dx, dy);
    if (off > posWin) return callPitch('strike', sub + ' · 헛스윙');
    const qPos = 1 - off / posWin, qTime = 1 - Math.abs(dt) / win;
    const q = clamp(0.55 * qPos + 0.45 * qTime, 0, 1);
    let ev = 95 + q * 75 + (S.power ? 12 : 0) + rand(-6, 6);
    // 공보다 아래를 치면(탭이 공 아래) 뜨고, 위를 치면 땅볼
    let la = clamp(14 - dy / posWin * 38 + rand(-5, 5), -20, 70);
    let dir = clamp(-dt / win * 55 + rand(-6, 6), -70, 70);
    if (q < 0.25 && Math.random() < 0.6) dir = (Math.random() < 0.5 ? -1 : 1) * rand(48, 80);
    const res = judgeBatted(ev, la, dir);
    const timing = Math.abs(dt) < win * 0.25 ? '정타 타이밍' : dt < 0 ? '조금 빠름' : '조금 늦음';
    launchFlight(res, `${Math.round(ev)}km/h · ${Math.round(la)}° · ${timing}`);
  };

  // ---------- 투구 모드: 내가 던지고 AI가 친다 ----------
  const aim = { active: false, start: 0, x: 0, y: 0 };
  const readyPitch = () => {
    if (S.mode !== 'pitch') return;
    S.phase = 'idle';
    hint('구종을 고르고, 존 위를 눌러 조준하세요. 노란 링이 흰 링과 겹칠 때 손을 떼면 정확히 들어가요.');
  };
  const shrinkScale = t => { const c = 1.3; const u = ((t / 1000) % c) / c; return 2.4 - u * 2.0; }; // 2.4 → 0.4 반복
  const startAim = (cx, cy) => {
    if (S.mode !== 'pitch' || S.phase !== 'idle') return;
    aim.active = true; aim.start = now(); aim.x = cx; aim.y = cy;
    $('aimTarget').hidden = false; $('aimShrink').hidden = false; moveAim(cx, cy);
  };
  const moveAim = (cx, cy) => {
    if (!aim.active) return;
    aim.x = cx; aim.y = cy;
    for (const id of ['aimTarget', 'aimShrink']) { const e = $(id); e.style.left = cx + 'px'; e.style.top = cy + 'px'; }
  };
  const releaseAim = () => {
    if (!aim.active) return;
    aim.active = false; $('aimTarget').hidden = true; $('aimShrink').hidden = true;
    const sc = shrinkScale(now() - aim.start);
    const acc = clamp(1 - Math.abs(sc - 1) / 1.0, 0, 1);       // 1 = 완벽
    const pt = pickPlate(aim.x, aim.y) || new BABYLON.Vector3(0, 0.8, 0);
    const err = (1 - acc) * 0.38;
    const a = Math.random() * Math.PI * 2;
    const tgt = new BABYLON.Vector3(clamp(pt.x + Math.cos(a) * err, -0.8, 0.8), clamp(pt.y + Math.sin(a) * err, 0.15, 1.6), 0);
    S.pitch = makePitch(S.selPitch, tgt, 0.6 + 0.4 * acc);
    S.pitch.acc = acc;
    const accText = acc > 0.85 ? '완벽한 릴리즈' : acc > 0.55 ? '좋은 릴리즈' : '실투';
    hint(accText);
    windup(() => { S.pitch.t0 = now(); S.phase = 'pitch'; ball.isVisible = true; shadow.isVisible = true; });
  };
  const aiBatterDecide = () => {
    const pc = S.pitch;
    const zone = inZone(pc.target);
    const edge = zone ? Math.min(ZONE.x - Math.abs(pc.target.x), pc.target.y - ZONE.yLo, ZONE.yHi - pc.target.y) : 0;
    let swingP = zone ? 0.72 : 0.28;
    if (S.strikes === 2) swingP += 0.15;
    if (S.balls === 3) swingP -= 0.15;
    const sub = `${pc.name} ${pc.kmh}km/h`;
    if (Math.random() > swingP) return callPitch(zone ? 'strike' : 'ball', sub + (zone ? ' · 루킹' : ''));
    const breakBonus = { fast: 0, slider: 0.1, curve: 0.12, change: 0.1 }[pc.type];
    let contact = 0.8 - breakBonus - (zone ? clamp(0.12 - edge, 0, 0.12) * 1.5 : 0.3) - (pc.acc > 0.85 ? 0.08 : 0);
    if (Math.random() > contact) return callPitch('strike', sub + ' · 헛스윙');
    const q = Math.random() * (pc.acc > 0.85 ? 0.8 : 1) + (pc.acc < 0.5 ? 0.25 : 0);
    const ev = 90 + clamp(q, 0, 1) * 80;
    const la = rand(-15, 45);
    const dir = rand(-60, 60);
    swingAnim = now();
    launchFlight(judgeBatted(ev, la, dir), `${Math.round(ev)}km/h · ${Math.round(la)}°`);
  };

  // ---------- 타구 비행 ----------
  const launchFlight = (res, sub) => {
    S.phase = 'flight';
    flight = { res, sub, t0: now(), pts: res.fl.pts };
    ball.isVisible = true; shadow.isVisible = true;
  };
  const finishFlight = () => {
    const { res, sub } = flight; flight = null;
    landMark.position.set(res.fl.land.x, 0.04, res.fl.land.z); landMark.isVisible = res.kind !== 'foul';
    const d = Math.round(res.fl.dist);
    if (res.kind === 'foul') return callPitch('foul', sub);
    if (res.kind === 'hr') return endPA('hr', '홈런!', `${d}m · ${sub}`);
    if (res.kind === 'hit') return endPA('hit', res.label, `${d}m · ${sub}`);
    return endPA('out', res.label, `${d}m · ${sub}`);
  };

  // ---------- 매 프레임 ----------
  let swingAnim = 0;
  const camHome = { tgt: new BABYLON.Vector3(0, 0.5, MOUND_Z) };
  let camTgt = camHome.tgt.clone();
  scene.onBeforeRenderObservable.add(() => {
    const t = now();
    // 와인드업: 팔 돌리기 0.7초
    if (S.phase === 'windup') {
      const u = (t - windT) / 700;
      pitchArm.rotation.x = -u * Math.PI * 1.6;
      if (u >= 1) { pitchArm.rotation.x = 0.3; const cb = windCb; windCb = null; cb && cb(); }
    }
    // 스윙 애니메이션 0.18초
    const su = (t - swingAnim) / 180;
    if (su >= 0 && su <= 1) batPivot.rotation.set(0, -su * Math.PI * 1.1, -0.6 - su * 0.9);
    else if (su > 2.5) batPivot.rotation.copyFrom(BAT_REST);

    if (S.phase === 'pitch' && S.pitch) {
      const s = (t - S.pitch.t0) / (S.pitch.dur * 1000);
      const p = pitchPos(S.pitch, Math.min(s, 1.15));
      ball.position.copyFrom(p);
      shadow.position.set(p.x, 0.03, p.z);
      if (S.mode === 'bat') {
        if (S.swing && t >= S.swing.t && s >= 0) {
          // 스윙 시점 또는 공 도착 중 늦은 쪽에서 판정
          if (s >= 1 || t - S.swing.t > 60) { S.phase = 'judge'; resolveSwing(); }
        } else if (s >= 1.12) {
          S.phase = 'judge';
          const sub = `${S.pitch.name} ${S.pitch.kmh}km/h`;
          callPitch(inZone(S.pitch.target) ? 'strike' : 'ball', sub + (inZone(S.pitch.target) ? ' · 루킹' : ''));
        }
      } else if (s >= 0.93) {
        S.phase = 'judge'; aiBatterDecide();
      }
    }
    if (S.phase === 'judge' && !flight && S.mode === 'bat' && ball.position.z < -0.2) ball.isVisible = false;

    if (flight) {
      const i = Math.max(0, Math.floor((t - flight.t0) / (1000 / 60) * 1.4));
      const pts = flight.pts;
      const p = pts[Math.min(i, pts.length - 1)];
      ball.position.copyFrom(p); shadow.position.set(p.x, 0.03, p.z);
      camTgt = BABYLON.Vector3.Lerp(camTgt, new BABYLON.Vector3(p.x, Math.max(1, p.y * 0.6), Math.max(p.z, 8)), 0.08);
      if (i >= pts.length - 1) finishFlight();
    } else {
      camTgt = BABYLON.Vector3.Lerp(camTgt, camHome.tgt, 0.08);
    }
    cam.setTarget(camTgt);

    if (aim.active) {
      const sc = shrinkScale(t - aim.start);
      $('aimShrink').style.transform = `translate(-50%, -50%) scale(${sc})`;
      const good = Math.abs(sc - 1) < 0.15;
      $('aimShrink').style.borderColor = good ? '#7CFF8A' : '';
    }
  });

  // ---------- 입력 ----------
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (S.mode === 'bat') doSwing(e.clientX, e.clientY);
    else startAim(e.clientX, e.clientY);
  });
  window.addEventListener('pointermove', e => { if (aim.active) moveAim(e.clientX, e.clientY); });
  window.addEventListener('pointerup', () => releaseAim());
  window.addEventListener('pointercancel', () => releaseAim());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  const setMode = m => {
    if (S.phase === 'pitch' || S.phase === 'flight' || S.phase === 'windup') return;
    S.mode = m; S.outs = 0; S.stats = { pa: 0, hit: 0, hr: 0, k: 0 }; resetCount();
    $('modeBat').setAttribute('aria-pressed', m === 'bat'); $('modePitch').setAttribute('aria-pressed', m === 'pitch');
    $('batDock').hidden = m !== 'bat'; $('pitchDock').hidden = m !== 'pitch';
    $('nextBtn').hidden = true; $('banner').classList.remove('show');
    batter.getChildMeshes().forEach(x => { x.material.alpha = m === 'bat' ? 0.55 : 1; });
    renderBoard(); S.phase = 'idle';
    if (m === 'bat') { hint('공이 홈플레이트에 들어오는 순간, 공이 있는 곳을 탭하세요.'); setTimeout(startAIPitch, 900); }
    else readyPitch();
  };
  $('modeBat').onclick = () => setMode('bat');
  $('modePitch').onclick = () => setMode('pitch');
  $('nextBtn').onclick = nextPA;
  $('powerBtn').onclick = () => { S.power = !S.power; $('powerBtn').setAttribute('aria-pressed', S.power); };
  $('slowBtn').onclick = () => {
    S.rookie = !S.rookie; $('slowBtn').setAttribute('aria-pressed', S.rookie);
    $('slowBtn').textContent = S.rookie ? '루키(느리게)' : '프로(실제 속도)';
  };
  document.querySelectorAll('.card').forEach(c => c.onclick = () => {
    S.selPitch = c.dataset.pitch;
    document.querySelectorAll('.card').forEach(x => x.setAttribute('aria-pressed', x === c));
  });

  window.addEventListener('resize', () => engine.resize());
  engine.runRenderLoop(() => scene.render());
  scene.executeWhenReady(() => {
    $('loading').hidden = true; renderBoard();
    setTimeout(startAIPitch, 1000);
  });
})();
</script>
</body>
</html>
