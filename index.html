<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>풀카운트 v0.1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage"><canvas id="game" aria-label="야구장"></canvas></div>

<div class="board">
  <div class="score" aria-label="점수">
    <div class="inning" id="inning">1회 초</div>
    <div class="teams">
      <div class="team" id="awayRow"><span id="awayName">원정</span><b id="awayRuns">0</b></div>
      <div class="team" id="homeRow"><span id="homeName">홈</span><b id="homeRuns">0</b></div>
    </div>
    <div class="diamond" aria-label="주자">
      <span class="base" id="base2"></span><span class="base" id="base3"></span><span class="base" id="base1"></span>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="count" aria-live="polite">
    <div class="row b" aria-label="볼">B <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span></div>
    <div class="row s" aria-label="스트라이크">S <span class="bulb"></span><span class="bulb"></span></div>
    <div class="row o" aria-label="아웃">O <span class="bulb"></span><span class="bulb"></span></div>
  </div>
  <button class="pause-btn" id="pauseBtn" aria-label="일시정지">❚❚</button>
</div>

<div class="dock" id="batDock">
  <button class="chip" id="powerBtn" aria-pressed="false">파워 스윙</button>
  <button class="chip" id="slowBtn" aria-pressed="true">루키(느리게)</button>
</div>
<div class="dock" id="pitchDock" hidden>
  <div class="cards" id="pitchCards"></div>
  <button class="chip" id="changeBtn">투수 교체</button>
</div>
<div class="sheet" id="bullpen" role="dialog" aria-label="투수 교체" hidden>
  <h2>투수 교체</h2>
  <p id="bullpenNow"></p>
  <div id="bullpenList"></div>
  <button class="chip" id="bullpenClose">취소</button>
</div>

<div class="hint" id="hint">공이 홈플레이트에 들어오는 순간, 공이 있는 곳을 탭하세요.</div>
<div class="banner" id="banner"></div>
<button class="next" id="nextBtn" hidden>다음 타석</button>
<button class="chip ff" id="ffBtn" hidden>빨리 감기 ▶▶</button>

<!-- 시작 메뉴 -->
<div class="overlay" id="menu" hidden>
  <div class="panel menu-panel">
    <h1 class="title">풀카운트</h1>
    <p class="tagline">타이밍과 손맛으로 치고 던지는 한 경기</p>
    <div class="field"><span class="label">내 팀</span><div class="team-pick" id="teamPick"></div></div>
    <div class="field"><span class="label">홈 / 원정</span>
      <div class="seg" id="pickSide"><button>원정 (먼저 공격)</button><button>홈 (나중 공격)</button></div></div>
    <div class="field"><span class="label">이닝</span>
      <div class="seg" id="pickInnings"><button>3이닝</button><button>9이닝</button></div></div>
    <div class="field"><span class="label">시간</span>
      <div class="seg" id="pickTime"><button>낮 경기</button><button>밤 경기</button></div></div>
    <div class="field"><span class="label">난이도</span>
      <div class="seg" id="pickLevel"><button>루키 (공이 느리게)</button><button>프로 (실제 속도)</button></div></div>
    <button class="big-btn" id="startBtn">경기 시작</button>
  </div>
</div>

<!-- 일시정지 -->
<div class="overlay" id="pause" hidden>
  <div class="panel small-panel">
    <h2>일시정지</h2>
    <button class="big-btn" id="resumeBtn">이어하기</button>
    <button class="big-btn ghost" id="toMenuBtn">처음으로</button>
  </div>
</div>

<!-- 경기 결과 -->
<div class="overlay scroll" id="result" hidden>
  <div class="panel result-panel">
    <h1 class="result-title" id="resultTitle">승리!</h1>
    <p class="result-score" id="resultScore"></p>
    <table class="tbl line" id="lineScore"></table>
    <div class="records" id="records"></div>
    <h3>내 타자 기록</h3>
    <table class="tbl" id="myBatting"></table>
    <h3>내 투수 기록</h3>
    <table class="tbl" id="myPitching"></table>
    <div class="result-btns">
      <button class="big-btn" id="againBtn">다시 하기</button>
      <button class="big-btn ghost" id="resultMenuBtn">메뉴로</button>
    </div>
  </div>
</div>
<div class="ring" id="aimTarget" hidden></div>
<div class="ring" id="aimShrink" hidden></div>
<div class="ring" id="tapMark"></div>
<div class="loading" id="loading">구장 준비 중…</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.20.0/babylon.js"></script>
<script src="js/core.js"></script>
<script src="js/data/pitches.js"></script>
<script src="js/data/teams.js"></script>
<script src="js/scene.js"></script>
<script src="js/stadium.js"></script>
<script src="js/lighting.js"></script>
<script src="js/players.js"></script>
<script src="js/ui.js"></script>
<script src="js/pitching.js"></script>
<script src="js/batting.js"></script>
<script src="js/play.js"></script>
<script src="js/game.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
