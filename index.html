<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>풀카운트 v0.1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage"><canvas id="game" aria-label="야구장"></canvas></div>

<div class="board">
  <div class="count" aria-live="polite">
    <div class="row b" aria-label="볼">B <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span></div>
    <div class="row s" aria-label="스트라이크">S <span class="bulb"></span><span class="bulb"></span></div>
    <div class="row o" aria-label="아웃">O <span class="bulb"></span><span class="bulb"></span></div>
  </div>
  <div class="stats" id="stats">타석 0 · 안타 0 · 홈런 0 · 삼진 0</div>
  <div class="modes" role="group" aria-label="모드">
    <button id="modeBat" aria-pressed="true">타격</button>
    <button id="modePitch" aria-pressed="false">투구</button>
  </div>
</div>

<div class="dock" id="batDock">
  <button class="chip" id="powerBtn" aria-pressed="false">파워 스윙</button>
  <button class="chip" id="slowBtn" aria-pressed="true">루키(느리게)</button>
</div>
<div class="dock" id="pitchDock" hidden>
  <button class="card" data-pitch="fast" aria-pressed="true">직구<small>빠르고 곧게</small></button>
  <button class="card" data-pitch="slider" aria-pressed="false">슬라이더<small>옆으로 휨</small></button>
  <button class="card" data-pitch="curve" aria-pressed="false">커브<small>크게 떨어짐</small></button>
  <button class="card" data-pitch="change" aria-pressed="false">체인지업<small>느리게 떨어짐</small></button>
</div>

<div class="hint" id="hint">공이 홈플레이트에 들어오는 순간, 공이 있는 곳을 탭하세요.</div>
<div class="banner" id="banner"></div>
<button class="next" id="nextBtn" hidden>다음 타석</button>
<div class="ring" id="aimTarget" hidden></div>
<div class="ring" id="aimShrink" hidden></div>
<div class="ring" id="tapMark"></div>
<div class="loading" id="loading">구장 준비 중…</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.20.0/babylon.js"></script>
<script src="js/core.js"></script>
<script src="js/data/pitches.js"></script>
<script src="js/scene.js"></script>
<script src="js/players.js"></script>
<script src="js/ui.js"></script>
<script src="js/pitching.js"></script>
<script src="js/batting.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
